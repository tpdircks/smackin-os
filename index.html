  <script>
  /* Hard-refresh escape. Runs from this document, so Ctrl+Shift+R or
     Cmd+Shift+R can drop a stale smackin-inv worker even when that worker
     swallows sw-escape.js. Only an older smackin-inv cache is removed. */
  (function () {
    var EMBEDDED = "smackin-inv-v260";
    function ver(id) {
      var m = /smackin-inv-v(\d+)/.exec(String(id || ""));
      return m ? parseInt(m[1], 10) : 0;
    }
    if (!("serviceWorker" in navigator) || !window.caches) return;
    caches.keys().then(function (keys) {
      if (window.__smackinSwEscapeLock) return;
      var mine = ver(EMBEDDED);
      var newer = false;
      var older = [];
      for (var i = 0; i < keys.length; i++) {
        if (keys[i].indexOf("smackin-inv-") !== 0) continue;
        var n = ver(keys[i]);
        if (!n) continue;
        if (n > mine) newer = true;
        else if (n < mine) older.push(keys[i]);
      }
      if (newer || !older.length) return;
      var here = new URL(location.href);
      if (here.searchParams.get("v") === EMBEDDED) {
        older.forEach(function (k) { caches.delete(k); });
        return;
      }
      window.__smackinSwEscapeLock = 1;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        var jobs = [];
        for (var i = 0; i < regs.length; i++) {
          var reg = regs[i];
          var w = reg.active || reg.waiting || reg.installing;
          var script = w && w.scriptURL ? w.scriptURL : "";
          var scope = reg.scope || "";
          var ours = script.indexOf("/smackin-os/service-worker.js") !== -1
            || (scope.indexOf("/smackin-os/") !== -1 && script.indexOf("service-worker.js") !== -1);
          if (ours) jobs.push(reg.unregister());
        }
        return Promise.all(jobs);
      }).then(function () {
        return Promise.all(older.map(function (k) { return caches.delete(k); }));
      }).then(function () {
        here.searchParams.set("v", EMBEDDED);
        location.replace(here.href);
      }).catch(function () { window.__smackinSwEscapeLock = 0; });
    }).catch(function () {});
  })();
  </script>
